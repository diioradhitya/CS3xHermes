name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Single checkout: artifacts are published into builds/ on the SAME
      # branch as the sources. The old separate "builds" branch is gone.
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: "main"
          path: "src"

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Build Plugins
        working-directory: ${{ github.workspace }}/src
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          JITPACK_USERNAME: ${{ secrets.JITPACK_USER }}
          JITPACK_PASSWORD: ${{ secrets.JITPACK_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Publish artifacts
        working-directory: ${{ github.workspace }}/src
        run: |
          # Drop stale artifacts so a removed/renamed plugin cannot linger.
          rm -f builds/*.cs3 builds/plugins.json
          shopt -s nullglob
          for f in */build/*.cs3; do
            cp "$f" builds/"$(basename "$f")"
          done
          cp build/plugins.json builds/plugins.json
          ls -la builds/*.cs3 builds/plugins.json

      - name: Push artifacts to main
        working-directory: ${{ github.workspace }}/src
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A builds/
          git diff --staged --quiet || (git commit -m "build: publish artifacts" && git push origin HEAD:main)
